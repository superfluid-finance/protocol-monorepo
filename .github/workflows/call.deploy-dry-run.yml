name: Reusable Workflow | Deploy Framework and Update Tokens on a Forked Network

on:
  workflow_call:
    inputs:
      network:
        required: true
        type: string
      provider-url:
        required: true
        type: string

jobs:
  deploy-to-forked-network:
    name: Deploy Framework and Update Tokens on a Forked Network
    runs-on: ubuntu-22.04
    env:
      ethereum-contracts-working-directory: ./packages/ethereum-contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install and Build
        run: |
          yarn install --frozen-lockfile
          yarn build-for-contracts-dev

      - name: Disabled — legacy truffle ops removed in v1.16.0
        run: |
          echo "This workflow depended on ops-scripts/ (deploy-test-environment, gov-upgrade-super-token-logic)."
          echo "See packages/ethereum-contracts/docs/ops-scripts-migration.md"
          exit 1
